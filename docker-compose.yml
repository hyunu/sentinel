name: sentinel

services:
  mongodb:
    image: mongo:7
    container_name: sentinel-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: sentinel

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "5050"
      MONGODB_URI: "mongodb://mongodb:27017"
      MONGODB_DATABASE: "sentinel"
      # AI is optional. Configure these in .env or the shell before
      # `docker compose up`. Any OpenAI-compatible endpoint works
      # (vLLM, Ollama, FriendliAI, OpenAI, Gemini compat, etc.).
      AI_PROVIDER: "${AI_PROVIDER:-}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_MAX_TOKENS: "${AI_MAX_TOKENS:-1024}"
      AI_TEMPERATURE: "${AI_TEMPERATURE:-0.2}"
      AI_TIMEOUT_SECONDS: "${AI_TIMEOUT_SECONDS:-60}"
      AI_MAX_TOOL_ROUNDS: "${AI_MAX_TOOL_ROUNDS:-6}"
      AI_API_TOKEN: "${AI_API_TOKEN:-}"
      AI_RATE_LIMIT_PER_MINUTE: "${AI_RATE_LIMIT_PER_MINUTE:-30}"
    depends_on:
      - mongodb

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: sentinel-dashboard
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
